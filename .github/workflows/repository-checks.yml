name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[test]'

      - name: Validate JSON and YAML syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix == '.json':
                  with path.open(encoding='utf-8') as handle:
                      json.load(handle)
                  print(f'JSON OK {path}')
              elif path.suffix in {'.yaml', '.yml'}:
                  with path.open(encoding='utf-8') as handle:
                      yaml.safe_load(handle)
                  print(f'YAML OK {path}')
          PY

      - name: Validate contract-generated UI inputs
        run: python -m generator validate .

      - name: Run regression tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q generator tests

      - name: Reject tracked credential and private Home Assistant files
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(secrets\.yaml|\.env($|\.)|\.storage(/|$)|.*\.(pem|key|p12)$|home-assistant_v2\.db)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden" ]; then
            echo 'Forbidden private/credential-like files are tracked:'
            echo "$forbidden"
            exit 1
          fi
