name: NikaS contract toolkit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nikas-contract-toolkit:
    name: nikas-contract-toolkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install -e '.[test]'
      - name: Test inspector and snapshot boundaries
        run: python -m pytest -q tests/test_nikas_repository_contract.py tests/test_contract_snapshot_checkout.py tests/test_nikas_repository_registry.py
      - name: Validate factual profile schemas
        run: python scripts/nikas_repository_contract.py schema --registry deployments/repository-contracts
      - name: Explain result scope
        run: |
          echo 'Toolkit/schema validation only. This job does not certify the registered repositories as compliant.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Run NikaS fleet inspection for strict results against the pinned revisions.' >> "$GITHUB_STEP_SUMMARY"
