api_version: nikas.home-assistant/ui-contract/v1
kind: UIContract
metadata:
  id: infrastructure.power_grid
  title: Электросеть
  version: 0.3.0
  description: "Central electrical-grid contract with three UI control points: before stabilizers, after stabilizers, and the non-interruptible boiler line."
spec:
  roles:
    grid_ok:
      label: Три фазы
      description: Сводное наличие трёх фаз до стабилизаторов.
      required: true
      allowed_domains:
      - binary_sensor
    meter_online:
      label: Измеритель
      description: Доступность измерителя входящей электросети.
      required: true
      allowed_domains:
      - binary_sensor
    phase_a_present:
      label: Фаза A
      description: Наличие фазы A до стабилизаторов.
      required: true
      allowed_domains:
      - binary_sensor
    phase_b_present:
      label: Фаза B
      description: Наличие фазы B до стабилизаторов.
      required: true
      allowed_domains:
      - binary_sensor
    phase_c_present:
      label: Фаза C
      description: Наличие фазы C до стабилизаторов.
      required: true
      allowed_domains:
      - binary_sensor
    phase_loss:
      label: Потеря фазы
      description: Флаг потери одной или нескольких входящих фаз.
      required: true
      allowed_domains:
      - binary_sensor
    voltage_a:
      label: Напряжение A
      description: Напряжение фазы A до стабилизаторов.
      required: true
      allowed_domains:
      - sensor
    voltage_b:
      label: Напряжение B
      description: Напряжение фазы B до стабилизаторов.
      required: true
      allowed_domains:
      - sensor
    voltage_c:
      label: Напряжение C
      description: Напряжение фазы C до стабилизаторов.
      required: true
      allowed_domains:
      - sensor
    voltage_imbalance:
      label: Перекос
      description: Перекос фазных напряжений до стабилизаторов.
      required: true
      allowed_domains:
      - sensor
    total_power:
      label: Мощность
      description: Суммарная активная мощность входящей трёхфазной сети.
      required: true
      allowed_domains:
      - sensor
    non_interruptible_voltage:
      label: Линия котла · U
      description: Входное напряжение UPS Котёл как фактический контроль неотключаемой линии.
      required: true
      allowed_domains:
      - sensor
    non_interruptible_frequency:
      label: Линия котла · Hz
      description: Входная частота UPS Котёл как параметр неотключаемой линии.
      required: true
      allowed_domains:
      - sensor
    non_interruptible_mode:
      label: Линия котла · режим
      description: Режим UPS Котёл для понимания фактического источника питания линии.
      required: true
      allowed_domains:
      - sensor
    non_interruptible_data_stale:
      label: Линия котла · данные
      description: Флаг устаревшей телеметрии UPS Котёл.
      required: true
      allowed_domains:
      - binary_sensor
  states:
    normal:
      description: Фактическое штатное состояние источника.
      rules: []
    event:
      description: Фактическое событие или отклонение источника.
      rules: []
    unreliable:
      description: Источник unknown/unavailable либо не позволяет установить факт.
      rules: []
  actions:
  - id: open_power_subpanel
    kind: navigate
    description: Открыть центральную субпанель Электросеть.
    role: grid_ok
    target: /dashboard-infrastructure/power-overview
  - id: more_info_meter_online
    kind: more_info
    description: Открыть more-info сущности.
    role: meter_online
  - id: more_info_phase_a_present
    kind: more_info
    description: Открыть more-info сущности.
    role: phase_a_present
  - id: more_info_phase_b_present
    kind: more_info
    description: Открыть more-info сущности.
    role: phase_b_present
  - id: more_info_phase_c_present
    kind: more_info
    description: Открыть more-info сущности.
    role: phase_c_present
  - id: more_info_phase_loss
    kind: more_info
    description: Открыть more-info сущности.
    role: phase_loss
  - id: more_info_voltage_a
    kind: more_info
    description: Открыть more-info сущности.
    role: voltage_a
  - id: more_info_voltage_b
    kind: more_info
    description: Открыть more-info сущности.
    role: voltage_b
  - id: more_info_voltage_c
    kind: more_info
    description: Открыть more-info сущности.
    role: voltage_c
  - id: more_info_voltage_imbalance
    kind: more_info
    description: Открыть more-info сущности.
    role: voltage_imbalance
  - id: more_info_total_power
    kind: more_info
    description: Открыть more-info сущности.
    role: total_power
  - id: more_info_non_interruptible_voltage
    kind: more_info
    description: Открыть входное напряжение UPS Котёл.
    role: non_interruptible_voltage
  - id: more_info_non_interruptible_frequency
    kind: more_info
    description: Открыть входную частоту UPS Котёл.
    role: non_interruptible_frequency
  - id: more_info_non_interruptible_mode
    kind: more_info
    description: Открыть режим UPS Котёл.
    role: non_interruptible_mode
  - id: more_info_non_interruptible_data_stale
    kind: more_info
    description: Открыть состояние свежести данных UPS Котёл.
    role: non_interruptible_data_stale
  presentation:
    renderer: tiles_v1
    columns: 3
    role_order:
    - grid_ok
    - meter_online
    - phase_a_present
    - phase_b_present
    - phase_c_present
    - phase_loss
    - voltage_a
    - voltage_b
    - voltage_c
    - voltage_imbalance
    - total_power
    - non_interruptible_voltage
    - non_interruptible_frequency
    - non_interruptible_mode
    - non_interruptible_data_stale
    role_groups:
      status:
      - grid_ok
      - meter_online
      - phase_loss
      - phase_a_present
      - phase_b_present
      - phase_c_present
      - non_interruptible_mode
      - non_interruptible_data_stale
      telemetry:
      - voltage_a
      - voltage_b
      - voltage_c
      - voltage_imbalance
      - total_power
      - non_interruptible_voltage
      - non_interruptible_frequency
      diagnostic: []
  safety:
    unknown_is_unreliable: true
    unavailable_is_unreliable: true
    invent_entity_ids: false
    notes:
    - Read-only infrastructure slice; all primary actions are more-info except the grid summary hand-off to the central electrical subpanel.
    - The non-interruptible line is a separate object, not a fourth phase.
    - The non-interruptible line takes voltage, frequency, operating mode and freshness from UPS Котёл input telemetry.
    - The after-stabilizer control point is reserved in UI v0.12 and must not fabricate values before verified semantic bindings are added.
