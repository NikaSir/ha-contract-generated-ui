api_version: nikas.home-assistant/panel-manifest/v1
kind: PanelManifest
metadata:
  id: actions
  title: Действия
  version: 1.0.0
  description: Центральная панель быстрых действий v11. Рабочий маршрут /dashboard-actions.
spec:
  dashboard_path: /dashboard-actions
  app_shell:
    active: actions
    routes:
      home: /dashboard-house-v11/home
      actions: /dashboard-actions/home
      infrastructure: /dashboard-infrastructure/overview
  views:
  - id: home
    title: Действия · v11.0
    path: home
    order: 0
    renderer: actions_home_v1
    modules:
    - contract: actions.home
      instance: access
      title: Ворота и доступ
      order: 0
      bindings:
        sectional_gate: actions.home.sectional_gate
    - contract: actions.home
      instance: cleaning
      title: Уборка
      order: 1
      bindings:
        vacuum_state: actions.home.vacuum_state
        vacuum_fault: actions.home.vacuum_fault
        vacuum_battery: actions.home.vacuum_battery
        station_clean: actions.home.station_clean
        station_dust: actions.home.station_dust
        station_dry: actions.home.station_dry
