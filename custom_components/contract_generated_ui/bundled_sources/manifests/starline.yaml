api_version: nikas.home-assistant/panel-manifest/v1
kind: PanelManifest
metadata:
  id: starline
  title: StarLine
  version: 0.5.0
  description: Read-only StarLine vehicle panel with automatic multi-vehicle grouping from the live Home Assistant registries.
spec:
  dashboard_path: /dashboard-starline
  subpanel:
    template: standard_v1
    navigation: main
    parent: house.vehicles
    source:
      kind: entity_registry
      platforms:
        - starline
      include_disabled: false
  views:
    - id: overview
      title: Обзор
      icon: mdi:view-dashboard-outline
      path: overview
      order: 0
      renderer: subpanel_placeholder_v1
      placeholder: Краткая сводка по каждому автомобилю StarLine. Управляющие команды намеренно отключены.
      readonly:
        domains:
          - binary_sensor
          - lock
          - sensor
          - switch
          - device_tracker
        priority_keywords:
          - security
          - охран
          - alarm
          - mileage
          - odometer
          - пробег
          - fuel
          - топлив
          - battery
          - аккумуля
          - акб
          - engine
          - двигат
          - cabin
          - interior
          - салон
          - temperature
          - температур
        exclude_keywords:
          - door
          - двер
          - hood
          - капот
          - trunk
          - багаж
          - brake
          - тормоз
          - hands free
          - hands_free
          - movement
          - движен
          - program
          - программ
        limit: 6
      modules: []
    - id: security
      title: Охрана
      icon: mdi:shield-car
      path: security
      order: 1
      renderer: subpanel_placeholder_v1
      placeholder: Состояния охраны и периметра выбранного автомобиля без команд постановки или снятия.
      readonly:
        domains:
          - binary_sensor
          - lock
        limit: 30
      modules: []
    - id: engine
      title: Двигатель
      icon: mdi:engine
      path: engine
      order: 2
      renderer: subpanel_placeholder_v1
      placeholder: Состояния двигателя, зажигания и отопителя выбранного автомобиля без запуска или остановки.
      readonly:
        domains:
          - switch
          - binary_sensor
          - sensor
        include_keywords:
          - engine
          - ignition
          - autostart
          - heater
          - webasto
          - двигат
          - зажиган
          - автозапуск
          - отопител
        limit: 24
      modules: []
    - id: vehicle
      title: Авто
      icon: mdi:car
      path: vehicle
      order: 3
      renderer: subpanel_placeholder_v1
      placeholder: Телеметрия и местоположение выбранного автомобиля в режиме только чтения.
      readonly:
        domains:
          - sensor
          - device_tracker
        limit: 40
      modules: []
    - id: service
      title: Сервис
      icon: mdi:stethoscope
      path: service
      order: 4
      renderer: subpanel_placeholder_v1
      placeholder: Контроль недоступных сущностей выбранного автомобиля StarLine без сервисных команд.
      readonly:
        domains:
          - binary_sensor
          - lock
          - sensor
          - switch
          - device_tracker
        unavailable_only: true
        limit: 40
      modules: []
