[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-contract-generated-ui"
version = "0.1.0.dev0"
description = "Contract-driven Home Assistant Lovelace generation and validation toolchain"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
ha-contract-ui = "generator.cli:main"

[tool.setuptools.packages.find]
include = ["generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
