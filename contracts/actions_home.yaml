api_version: nikas.home-assistant/ui-contract/v1
kind: UIContract
metadata:
  id: actions.home
  title: Действия
  version: 1.0.0
  description: Центральная панель быстрых действий NikaS. Содержит только подтверждённые фактические статусы и безопасный набор быстрых команд.
spec:
  roles:
    sectional_gate:
      label: Секционные ворота
      description: Фактическое положение секционных ворот только по физическому датчику.
      required: false
      allowed_domains:
      - binary_sensor
    vacuum_state:
      label: Пылесос
      description: Текущее состояние S8 OMNI.
      required: false
      allowed_domains:
      - vacuum
    vacuum_fault:
      label: Ошибка S8 OMNI
      description: Код или состояние ошибки S8 OMNI.
      required: false
      allowed_domains:
      - sensor
    vacuum_battery:
      label: АКБ S8 OMNI
      description: Уровень заряда S8 OMNI.
      required: false
      allowed_domains:
      - sensor
    station_clean:
      label: Чистка барабана
      description: Активность очистки ролика/барабана станции.
      required: false
      allowed_domains:
      - binary_sensor
    station_dust:
      label: Сбор пыли
      description: Активность сбора пыли станцией.
      required: false
      allowed_domains:
      - binary_sensor
    station_dry:
      label: Сушка
      description: Активность сушки станции.
      required: false
      allowed_domains:
      - binary_sensor
  states:
    normal:
      description: Фактическое штатное состояние источника.
      rules: []
    event:
      description: Фактическое активное состояние или событие.
      rules: []
    unreliable:
      description: Источник unknown/unavailable либо не позволяет установить факт.
      rules: []
  actions:
  - id: more_info_sectional_gate
    kind: more_info
    description: Открыть фактический датчик секционных ворот.
    role: sectional_gate
  - id: more_info_vacuum_state
    kind: more_info
    description: Открыть состояние S8 OMNI.
    role: vacuum_state
  - id: more_info_vacuum_fault
    kind: more_info
    description: Открыть ошибку S8 OMNI.
    role: vacuum_fault
  - id: more_info_vacuum_battery
    kind: more_info
    description: Открыть заряд S8 OMNI.
    role: vacuum_battery
  - id: more_info_station_clean
    kind: more_info
    description: Открыть состояние чистки станции.
    role: station_clean
  - id: more_info_station_dust
    kind: more_info
    description: Открыть состояние сбора пыли.
    role: station_dust
  - id: more_info_station_dry
    kind: more_info
    description: Открыть состояние сушки.
    role: station_dry
  presentation:
    renderer: tiles_v1
    columns: 2
    role_order:
    - sectional_gate
    - vacuum_state
    - vacuum_fault
    - vacuum_battery
    - station_clean
    - station_dust
    - station_dry
  safety:
    unknown_is_unreliable: true
    unavailable_is_unreliable: true
    invent_entity_ids: false
    notes:
    - Положение секционных ворот определяется только физическим датчиком; cover-состояние не является подтверждением положения.
    - Для распашных ворот физический датчик положения отсутствует; renderer показывает явную read-only заглушку.
    - 'ROXIMO cover-команды не входят в рабочую панель: управляющие устройства выведены из эксплуатации.'
    - 'actions_home_v1 может добавить только два allowlisted действия S8 OMNI: vacuum.start и vacuum.return_to_base, оба с обязательным подтверждением.'
    - Полив в центральной панели представлен переходом в специализированную панель; непроверенные управляющие сущности не подставляются.
