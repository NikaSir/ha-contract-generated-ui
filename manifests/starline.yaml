api_version: nikas.home-assistant/panel-manifest/v1
kind: PanelManifest
metadata:
  id: starline
  title: StarLine
  version: 0.6.0
  description: Native-inspired read-only StarLine vehicle panel with multi-vehicle overview, security, engine telemetry, map and Home Assistant history.
spec:
  dashboard_path: /dashboard-starline
  subpanel:
    template: standard_v1
    navigation: main
    parent: house.vehicles
    source:
      kind: entity_registry
      platforms:
        - starline
      include_disabled: false
  views:
    - id: overview
      title: Обзор
      icon: mdi:car-connected
      path: overview
      order: 0
      renderer: subpanel_placeholder_v1
      placeholder: Сводка выбранного автомобиля: связь, АКБ, топливо, температуры, пробег, моточасы, последнее событие и карта.
      readonly:
        domains:
          - binary_sensor
          - lock
          - sensor
          - switch
          - device_tracker
        limit: 40
      modules: []
    - id: security
      title: Охрана
      icon: mdi:shield-car
      path: security
      order: 1
      renderer: subpanel_placeholder_v1
      placeholder: Состояния охраны, замков, дверей, капота, багажника и ручного тормоза без управляющих команд.
      readonly:
        domains:
          - binary_sensor
          - lock
        limit: 40
      modules: []
    - id: engine
      title: Двигатель
      icon: mdi:engine
      path: engine
      order: 2
      renderer: subpanel_placeholder_v1
      placeholder: Двигатель, зажигание, отопитель и автомобильная телеметрия в режиме только чтения.
      readonly:
        domains:
          - switch
          - binary_sensor
          - sensor
        limit: 40
      modules: []
    - id: location
      title: Карта
      icon: mdi:map-marker-path
      path: location
      order: 3
      renderer: subpanel_placeholder_v1
      placeholder: Текущее местоположение и маршрут по истории Home Assistant.
      readonly:
        domains:
          - device_tracker
          - sensor
        include_keywords:
          - gps
          - location
          - местополож
          - speed
          - скорост
        limit: 20
      modules: []
    - id: history
      title: История
      icon: mdi:history
      path: history
      order: 4
      renderer: subpanel_placeholder_v1
      placeholder: Хронология изменений дверей, двигателя, зажигания, охраны и замков за последние 24 часа из Recorder Home Assistant.
      readonly:
        domains:
          - binary_sensor
          - lock
          - switch
        limit: 80
      modules: []
