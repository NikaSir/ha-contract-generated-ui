api_version: nikas.home-assistant/panel-manifest/v1
kind: PanelManifest
metadata:
  id: zont
  title: ZONT
  version: 0.7.0
  description: Semantic ZONT panel with actuator status and safe heating-mode controls.
spec:
  dashboard_path: /dashboard-zont
  subpanel:
    template: standard_v1
    navigation: main
    parent: house.heating
    source:
      kind: entity_registry
      platforms:
        - zont
        - zont_ha
      include_disabled: false
  views:
    - id: states
      title: Состояния
      icon: mdi:pump
      path: states
      order: 0
      renderer: subpanel_placeholder_v1
      placeholder: Насосы, смесительный привод и режимы отопления.
      readonly:
        domains:
          - sensor
          - binary_sensor
          - switch
          - climate
          - button
        include_keywords:
          - насос
          - pump
          - открытие
          - закрытие
          - смеситель
          - valve
          - радиатор
          - тёплый пол
          - теплый пол
          - циркуляц
          - резерв
          - режим
          - mode
          - комфорт
          - отпуск
          - автоматика
        limit: 100
      modules: []
    - id: boilers
      title: Котлы
      icon: mdi:water-boiler
      path: boilers
      order: 1
      renderer: subpanel_placeholder_v1
      placeholder: Основной и резервный котлы, температуры, давление и модуляция.
      readonly:
        domains:
          - climate
          - sensor
          - binary_sensor
        include_keywords:
          - boiler
          - котел
          - котёл
          - основной
          - резерв
          - ebus
          - modulation
          - модуляц
          - pressure
          - давлен
        limit: 50
      modules: []
    - id: heating
      title: Отопление
      icon: mdi:radiator
      path: heating
      order: 2
      renderer: subpanel_placeholder_v1
      placeholder: Радиаторы, тёплый пол, ГВС, циркуляция и резервный контур.
      readonly:
        domains:
          - climate
          - sensor
          - binary_sensor
        include_keywords:
          - radiator
          - радиатор
          - warm floor
          - floor
          - тёплый пол
          - теплый пол
          - circulation
          - циркуляц
          - reserve
          - резерв
          - гвс
          - dhw
          - гидрострел
        limit: 50
      modules: []
    - id: sensors
      title: Датчики
      icon: mdi:home-thermometer-outline
      path: sensors
      order: 3
      renderer: subpanel_placeholder_v1
      placeholder: Помещения, улица, влажность, батареи, RSSI и давление.
      readonly:
        domains:
          - sensor
          - binary_sensor
        include_keywords:
          - temperature
          - температур
          - humidity
          - влажн
          - battery
          - батаре
          - rssi
          - signal
          - street
          - outdoor
          - улиц
          - weather
          - погод
          - pressure
          - давлен
        limit: 50
      modules: []
    - id: diagnostics
      title: Диагностика
      icon: mdi:heart-pulse
      path: diagnostics
      order: 4
      renderer: subpanel_placeholder_v1
      placeholder: Контроллер H2000+ Pro, питание, ошибки, доступность и eBUS.
      readonly:
        domains:
          - sensor
          - binary_sensor
        limit: 50
      modules: []
