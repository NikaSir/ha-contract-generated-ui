api_version: nikas.home-assistant/panel-manifest/v1
kind: PanelManifest
metadata:
  id: zont
  title: ZONT
  version: 0.6.0
  description: Read-only semantic ZONT panel organized around boilers, heating, sensors and diagnostics.
spec:
  dashboard_path: /dashboard-zont
  subpanel:
    template: standard_v1
    navigation: main
    parent: house.heating
    source:
      kind: entity_registry
      platforms:
        - zont
        - zont_ha
      include_disabled: false
  views:
    - id: overview
      title: Обзор
      icon: mdi:view-dashboard-outline
      path: overview
      order: 0
      renderer: subpanel_placeholder_v1
      placeholder: Сводка по котлам, отопительным контурам и помещениям. Только просмотр.
      readonly:
        domains:
          - climate
          - sensor
          - binary_sensor
        limit: 50
      modules: []
    - id: boilers
      title: Котлы
      icon: mdi:water-boiler
      path: boilers
      order: 1
      renderer: subpanel_placeholder_v1
      placeholder: Основной и резервный котлы, температуры, давление и модуляция. Только просмотр.
      readonly:
        domains:
          - climate
          - sensor
          - binary_sensor
        include_keywords:
          - boiler
          - котел
          - котёл
          - основной
          - резерв
          - ebus
          - modulation
          - модуляц
          - pressure
          - давлен
        limit: 50
      modules: []
    - id: heating
      title: Отопление
      icon: mdi:radiator
      path: heating
      order: 2
      renderer: subpanel_placeholder_v1
      placeholder: Радиаторы, тёплый пол, ГВС, циркуляция и резервный контур. Только просмотр.
      readonly:
        domains:
          - climate
          - sensor
          - binary_sensor
        include_keywords:
          - radiator
          - радиатор
          - warm floor
          - floor
          - тёплый пол
          - теплый пол
          - circulation
          - циркуляц
          - reserve
          - резерв
          - гвс
          - dhw
          - гидрострел
        limit: 50
      modules: []
    - id: sensors
      title: Датчики
      icon: mdi:home-thermometer-outline
      path: sensors
      order: 3
      renderer: subpanel_placeholder_v1
      placeholder: Помещения, улица, влажность, батареи, RSSI и давление. Только просмотр.
      readonly:
        domains:
          - sensor
          - binary_sensor
        include_keywords:
          - temperature
          - температур
          - humidity
          - влажн
          - battery
          - батаре
          - rssi
          - signal
          - street
          - outdoor
          - улиц
          - weather
          - погод
          - pressure
          - давлен
        limit: 60
      modules: []
    - id: diagnostics
      title: Диагностика
      icon: mdi:heart-pulse
      path: diagnostics
      order: 4
      renderer: subpanel_placeholder_v1
      placeholder: Контроллер, питание, ошибки, доступность и eBUS. Только просмотр.
      readonly:
        domains:
          - sensor
          - binary_sensor
        limit: 60
      modules: []
