api_version: nikas.home-assistant/panel-manifest/v1
kind: PanelManifest
metadata:
  id: infrastructure
  title: Инфраструктура
  version: 0.4.0
  description: 'Production infrastructure panel v0.4: operational overview with a separate diagnostics view.'
spec:
  dashboard_path: /dashboard-infrastructure
  views:
  - id: overview
    title: Инфраструктура · v0.4
    path: overview
    order: 0
    modules:
    - contract: infrastructure.power_grid
      instance: power
      title: Электросеть
      order: 0
      groups:
      - status
      - telemetry
      bindings: &power_bindings
        grid_ok: infrastructure.power.grid_ok
        meter_online: infrastructure.power.meter_online
        phase_a_present: infrastructure.power.phase_a_present
        phase_b_present: infrastructure.power.phase_b_present
        phase_c_present: infrastructure.power.phase_c_present
        phase_loss: infrastructure.power.phase_loss
        voltage_a: infrastructure.power.voltage_a
        voltage_b: infrastructure.power.voltage_b
        voltage_c: infrastructure.power.voltage_c
        voltage_imbalance: infrastructure.power.voltage_imbalance
        total_power: infrastructure.power.total_power
        non_interruptible_voltage: infrastructure.power.non_interruptible_voltage
    - contract: infrastructure.ups
      instance: ups_internet
      title: UPS Интернет
      order: 1
      groups:
      - status
      - telemetry
      bindings: &ups_internet_bindings
        cloud_telemetry: infrastructure.ups.internet.cloud_telemetry
        data_stale: infrastructure.ups.internet.data_stale
        on_battery: infrastructure.ups.internet.on_battery
        data_age: infrastructure.ups.internet.data_age
        data_time: infrastructure.ups.internet.data_time
        operating_mode: infrastructure.ups.internet.operating_mode
        battery_capacity: infrastructure.ups.internet.battery_capacity
        battery_voltage: infrastructure.ups.internet.battery_voltage
        input_voltage: infrastructure.ups.internet.input_voltage
        input_frequency: infrastructure.ups.internet.input_frequency
        output_voltage: infrastructure.ups.internet.output_voltage
        output_frequency: infrastructure.ups.internet.output_frequency
        output_current: infrastructure.ups.internet.output_current
        output_load: infrastructure.ups.internet.output_load
    - contract: infrastructure.ups
      instance: ups_boiler
      title: UPS Котёл
      order: 2
      groups:
      - status
      - telemetry
      bindings: &ups_boiler_bindings
        cloud_telemetry: infrastructure.ups.boiler.cloud_telemetry
        data_stale: infrastructure.ups.boiler.data_stale
        on_battery: infrastructure.ups.boiler.on_battery
        data_age: infrastructure.ups.boiler.data_age
        data_time: infrastructure.ups.boiler.data_time
        operating_mode: infrastructure.ups.boiler.operating_mode
        battery_capacity: infrastructure.ups.boiler.battery_capacity
        battery_voltage: infrastructure.ups.boiler.battery_voltage
        input_voltage: infrastructure.ups.boiler.input_voltage
        input_frequency: infrastructure.ups.boiler.input_frequency
        output_voltage: infrastructure.ups.boiler.output_voltage
        output_frequency: infrastructure.ups.boiler.output_frequency
        output_current: infrastructure.ups.boiler.output_current
        output_load: infrastructure.ups.boiler.output_load
    - contract: infrastructure.keenetic
      instance: keenetic
      title: Keenetic Hero 4G+
      order: 3
      groups:
      - status
      - telemetry
      bindings: &keenetic_bindings
        active_wan: infrastructure.network.keenetic.active_wan
        ethernet_ping: infrastructure.network.keenetic.ethernet_ping
        ethernet_packet_loss: infrastructure.network.keenetic.ethernet_packet_loss
        lte_ping: infrastructure.network.keenetic.lte_ping
        lte_packet_loss: infrastructure.network.keenetic.lte_packet_loss
        last_wan_switch: infrastructure.network.keenetic.last_wan_switch
        last_wan_switch_reason: infrastructure.network.keenetic.last_wan_switch_reason
        wan_switches_today: infrastructure.network.keenetic.wan_switches_today
        lte_time_today: infrastructure.network.keenetic.lte_time_today
        temperature: infrastructure.network.keenetic.temperature
  - id: diagnostics
    title: Диагностика
    path: diagnostics
    order: 1
    modules:
    - contract: infrastructure.ups
      instance: ups_internet
      title: UPS Интернет
      order: 0
      groups:
      - diagnostic
      bindings: *ups_internet_bindings
    - contract: infrastructure.ups
      instance: ups_boiler
      title: UPS Котёл
      order: 1
      groups:
      - diagnostic
      bindings: *ups_boiler_bindings
    - contract: infrastructure.keenetic
      instance: keenetic
      title: Keenetic Hero 4G+
      order: 2
      groups:
      - diagnostic
      bindings: *keenetic_bindings
